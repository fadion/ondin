# A form control is built from the shared primitives in `crates/ondin-app/src/ui.rs`, which hold
# the standard (`docs/design/app-chrome.md`, *Shared rules*). The raw egui constructors are refused
# everywhere else; a site that has to use one says why in `#[expect(clippy::disallowed_methods,
# reason = "…")]`, so every exception is named and greppable.
disallowed-methods = [
    { path = "egui::TextEdit::singleline", reason = "a text entry is ui::text_field, ui::search_box or ui::inline_edit, which carry the field ground and the typing edge" },
    { path = "egui::TextEdit::multiline", reason = "a text entry is built in ui.rs, which carries the field ground and the typing edge" },
    { path = "egui::DragValue::new", reason = "a number is ui::value_field*, which carries the ground, the scrub strip and the typing edge" },
    { path = "egui::Button::new", reason = "a button is ui::field_button, ui::label_button, ui::action_button or settings::text_button, on ui::button_face's states" },
    { path = "egui::Ui::button", reason = "a button is ui::field_button, ui::label_button, ui::action_button or settings::text_button, on ui::button_face's states" },
    { path = "egui::Ui::small_button", reason = "a button is ui::field_button, ui::label_button, ui::action_button or settings::text_button, on ui::button_face's states" },
    { path = "egui::Ui::checkbox", reason = "a tick is ui::tick_box, a switch ui::switch_row" },
    { path = "egui::Ui::radio_value", reason = "a choice of a few is ui::segmented" },
    { path = "egui::Ui::text_edit_singleline", reason = "a text entry is ui::text_field, ui::search_box or ui::inline_edit" },
    { path = "egui::Ui::text_edit_multiline", reason = "a text entry is built in ui.rs, which carries the field ground and the typing edge" },
    { path = "egui::DragValue::from_get_set", reason = "a number is ui::value_field*, which carries the ground, the scrub strip and the typing edge" },
    { path = "egui::Checkbox::new", reason = "a tick is ui::tick_box, a switch ui::switch_row" },
    { path = "egui::Checkbox::without_text", reason = "a tick is ui::tick_box, a switch ui::switch_row" },
    { path = "egui::Slider::new", reason = "a slider is ui::slider" },
    { path = "egui::RadioButton::new", reason = "a choice of a few is ui::segmented" },
    { path = "egui::Ui::radio", reason = "a choice of a few is ui::segmented" },
    { path = "egui::Ui::toggle_value", reason = "an on/off button is ui::field_button with FieldButton::On, or ui::toggle_row" },
    { path = "egui::Ui::spinner", reason = "the loading spinner is ui::spinner, or ui::paint_spinner on a painter" },
]
# A widget with more than one way to build it (`Spinner` has `new` and `Default`) is refused by
# its type, which covers every constructor.
disallowed-types = [
    { path = "egui::Spinner", reason = "the loading spinner is ui::spinner, or ui::paint_spinner on a painter" },
]
