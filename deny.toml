# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
#   cargo install cargo-deny
#   cargo deny check
#
# Guards the dependency tree so a future `cargo update` cannot silently pull in a
# crate whose license is incompatible with shipping Ondin under MIT.
#
# ⚠️ There is no CI, so nothing runs this on a push. It belongs in the `release`
# skill's Phase 0 bar, which is the only gate this project has.

[licenses]
# Every license we accept. All permissive except MPL-2.0, which is weak
# (file-level) copyleft and does not reach our own source.
#
# GPL/LGPL are intentionally ABSENT. The only crates that mention them are
# dual-licensed — `self_cell` is "Apache-2.0 OR GPL-2.0-only" and `r-efi` is
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later" — and cargo-deny satisfies such an
# OR-expression via the permissive branch below, so no GPL or LGPL terms ever
# apply. If either crate ever drops its permissive option, this file fails and
# that is the point.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    # `option-ext`, reached through dirs → dirs-sys, which locates the font cache
    # and preferences directories. Weak, file-level copyleft: it obliges anyone
    # distributing *modified versions of those files* to publish them, and does
    # not reach Ondin's source. Used unmodified from crates.io.
    "MPL-2.0",
    # `webpki-roots` — Mozilla's CA root certificate set, reached through ureq's
    # TLS stack, which is how the Font tab downloads a web font. A *data* license
    # over the certificate bundle, and a permissive one: use and redistribute
    # freely, no copyleft, no obligation beyond the disclaimer.
    "CDLA-Permissive-2.0",
    # `epaint_default_fonts` is "(MIT OR Apache-2.0) AND OFL-1.1 AND
    # Ubuntu-font-1.0" — the ANDs are the fonts egui bundles, which ship in our
    # binary as fallbacks behind Inter. Both are free to redistribute unmodified;
    # the notices are in THIRD-PARTY-NOTICES.md and the texts in licenses/.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

# The fonts Ondin bundles ITSELF — Inter (OFL-1.1) and Phosphor (MIT) — are
# embedded assets rather than crates, so cargo-deny cannot see them. They are
# covered in THIRD-PARTY-NOTICES.md, with texts in the tree.

[advisories]
# Unmaintained crates pulled in transitively (e.g. through wgpu/winit/egui)
# cannot be fixed here — only flag unmaintained advisories for our own deps.
unmaintained = "workspace"
# Vulnerabilities are denied by default. Any entry added below must be a
# conscious, reviewed exception naming the advisory and why it is unreachable.
#
# 🚨 `cargo deny check advisories` is RED as of 2026-09-16, deliberately left so.
# Two advisories remain, and both are quick-xml < 0.41 (RUSTSEC-2026-0194,
# -0195): quadratic parse time on duplicate attribute names, and unbounded
# namespace allocation in `NsReader`.
#
# Neither reaches a shipped **Windows** build. `cargo tree -i quick-xml --target
# x86_64-pc-windows-msvc` prints nothing at all — quick-xml arrives only on Linux,
# through `wayland-scanner`, a build-time proc macro over Wayland's own vendored
# protocol XML rather than over anything a user supplies. ⚠️ **And Ondin's SVG
# import — the only untrusted XML it reads — uses `roxmltree`, not quick-xml**, so
# these do not touch the parser they look like they are about.
#
# They are not ignored, because they are not fixable here either: `cargo update -p
# quick-xml` is a no-op, the version being held at 0.39.4 by `wayland-scanner`'s
# own requirement (winit → smithay → wayland-scanner). It moves when winit's
# Wayland stack does. Do not add an `ignore` entry to make this green — a red line
# that names a real, unfixable constraint is worth more than a silenced one.
#
# ⚠️ Two others were here and were FIXED on 2026-09-16 rather than ignored, which
# is the outcome this block is for:
#   * RUSTSEC-2026-0285 — rustls < 0.23.45, TLS 1.3 handshake messages accepted
#     across encryption-level boundaries. This one DID reach the shipped build,
#     via `ureq` (how the Font tab downloads a web font). `cargo update -p rustls`
#     → 0.23.45, pulling rustls-webpki 0.103.15 with it.
#   * RUSTSEC-2026-0257 — webbrowser < 1.2.2, `BROWSER` argument injection, whose
#     fault is in the crate's `src/unix.rs` and so was unreachable on Windows.
#     `cargo update -p webbrowser` → 1.2.4 anyway.
ignore = []

[bans]
# Duplicate versions are unavoidable in a GPU + windowing tree; surface them
# without failing.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io. A dependency pulled from an unknown registry or a git URL fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
