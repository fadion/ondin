# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
#   cargo install cargo-deny
#   cargo deny check
#
# Guards the dependency tree so a future `cargo update` cannot silently pull in a
# crate whose license is incompatible with shipping Ondin under MIT.
#
# CI runs `check licenses` on every push (`.github/workflows/ci.yml`, §15 D955),
# and the `release` skill's Phase 0 runs it locally.

[licenses]
# Every license we accept. All permissive except MPL-2.0, which is weak
# (file-level) copyleft and does not reach our own source.
#
# GPL/LGPL are intentionally ABSENT. The only crates that mention them are
# dual-licensed — `self_cell` is "Apache-2.0 OR GPL-2.0-only" and `r-efi` is
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later" — and cargo-deny satisfies such an
# OR-expression via the permissive branch below, so no GPL or LGPL terms ever
# apply. If either crate ever drops its permissive option, this file fails and
# that is the point.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    # `option-ext`, reached through dirs → dirs-sys, which locates the font cache
    # and preferences directories. Weak, file-level copyleft: it obliges anyone
    # distributing *modified versions of those files* to publish them, and does
    # not reach Ondin's source. Used unmodified from crates.io.
    "MPL-2.0",
    # `webpki-roots` — Mozilla's CA root certificate set, reached through ureq's
    # TLS stack, which is how the Font tab downloads a web font. A *data* license
    # over the certificate bundle, and a permissive one: use and redistribute
    # freely, no copyleft, no obligation beyond the disclaimer.
    "CDLA-Permissive-2.0",
    # `epaint_default_fonts` is "(MIT OR Apache-2.0) AND OFL-1.1 AND
    # Ubuntu-font-1.0" — the ANDs are the fonts egui bundles, which ship in our
    # binary as fallbacks behind Inter. Both are free to redistribute unmodified;
    # the notices are in THIRD-PARTY-NOTICES.md and the texts in licenses/.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

# The fonts Ondin bundles ITSELF — Inter and Noto Emoji (OFL-1.1) — are
# embedded assets rather than crates, so cargo-deny cannot see them. They are
# covered in THIRD-PARTY-NOTICES.md, with texts in the tree.

[advisories]
# Unmaintained crates pulled in transitively (e.g. through wgpu/winit/egui)
# cannot be fixed here — only flag unmaintained advisories for our own deps.
unmaintained = "workspace"
# Vulnerabilities are denied by default. Any entry added below must be a
# conscious, reviewed exception naming the advisory and why it is unreachable.
#
# Fix an advisory with `cargo update` or a version bump first; ignore one only
# when no release of the crate pulling it in is patched.
#
# The `zip` entries below are held at 8.x by `velopack` 1.2, which requires
# `zip` ^8.6; the only `velopack` on zip 9 is a pre-release. All four are faults
# of `ZipArchive::extract` / `ZipStreamReader::extract`, which neither Ondin
# (the `.sketch` import and the export archive read and write entry by entry) nor
# `velopack` (its bundle copies entries out through `by_index`) calls. The
# workspace's own `zip` stays on 8.x beside it: on 9 it would compile a second
# copy and leave these advisories in the tree all the same. Drop them when
# `velopack` moves to zip 9, and move the workspace's `zip` with it.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip <9 SUID bits kept by ZipArchive::extract, which nothing in the tree calls" },
    { id = "RUSTSEC-2026-0368", reason = "zip <9 symlink escape in ZipArchive::extract, which nothing in the tree calls" },
    { id = "RUSTSEC-2026-0369", reason = "zip <9 permissions through symlinks in extract(), which nothing in the tree calls" },
    { id = "RUSTSEC-2026-0429", reason = "zip <9 abort on a large symlink entry in ZipArchive::extract, which nothing in the tree calls" },
]

[bans]
# Duplicate versions are unavoidable in a GPU + windowing tree; surface them
# without failing.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io. A dependency pulled from an unknown registry or a git URL fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
